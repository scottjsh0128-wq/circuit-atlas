<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Cadence 회로 연결 구조를 확인하고 편집하는 로컬 우선 워크스페이스"><title>Circuit Atlas · 회로 구조 편집기</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><a class="brand" href="./"><span class="brand-icon">⌘</span><span>CIRCUIT <b>ATLAS</b></span><small>WORKSPACE / 01</small></a><div class="header-actions"><span class="local-label">로컬 회로 워크스페이스</span><button id="helpBtn">CIW 추출 안내</button><a href="./simulation.html" style="color:#bce9d8">시뮬레이션 실험 ↗</a><button id="cadenceImportBtn">Cadence에서 불러오기</button><button class="primary" id="exportBtn">내보내기 ↗</button></div></header>
<main>
<aside class="library"><div class="panel-label">DESIGN EXPLORER</div><h2>회로 탐색</h2><label class="search"><span>⌕</span><input id="search" placeholder="소자 / 넷 검색" aria-label="소자 또는 넷 검색"></label><label class="field">현재 셀<select id="cellSelect"></select></label><div class="source" id="sourceInfo"></div><div class="side-tabs"><button data-list="instances" class="active">소자 <span id="instCount"></span></button><button data-list="nets">넷 <span id="netCount"></span></button></div><div id="explorer" class="explorer"></div><div class="side-bottom"><button id="addBtn">＋ 소자 / 포트 추가</button><button id="demoBtn" class="quiet">예제 회로 열기</button><p>Cadence 읽기 연결<br><span>스펙 연동은 후속 예정</span></p></div></aside>
<section class="workspace"><div class="work-title"><div><div class="eyebrow" id="breadcrumb">DEMO / ANALOG</div><h1 id="designTitle">Differential pair</h1></div><div id="reviewState" class="review-state">미검토</div></div><div class="toolbar"><div class="view-tabs"><button class="active" data-view="graph">연결도</button><button data-view="table">핀 · 넷 테이블</button><button data-view="changes">변경 내역 <span id="diffCount">0</span></button></div><div class="tool-actions"><button id="undoBtn" title="Ctrl+Z" aria-label="실행 취소">↶</button><button id="redoBtn" title="Ctrl+Shift+Z" aria-label="다시 실행">↷</button><span class="separator"></span><button id="wireBtn" title="W: 핀을 두 번 클릭해 연결">⌁ 연결</button><button id="rotateBtn" title="R: 시계 방향 90° 회전" disabled>↻ 회전</button><button id="mirrorBtn" title="Shift+R: 화면 기준 좌우 반전" disabled>⇆ 반전</button><button id="layoutBtn">자동 배치</button></div></div>
<div id="graphView" class="graph-wrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="편집 가능한 회로 연결도" tabindex="0"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#31414b"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/><g id="viewport"><g id="wires"></g><g id="nodes"></g><g id="netnodes"></g></g></svg><div class="canvas-caption"><span class="legend-line"></span>같은 넷 이름 = 같은 연결 <span>교차점은 접속점이 아닙니다</span></div><div class="zoom-controls"><button id="zoomOut" aria-label="축소">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대">＋</button><button id="fitBtn">맞춤</button></div><div class="canvas-hint" id="canvasHint">방향키: 화면 이동 · R: 90° 회전 · Shift+R: 좌우 반전</div></div>
<div id="tableView" class="data-view" hidden></div><div id="changesView" class="data-view" hidden></div>
<footer><span id="status">준비됨</span><span id="counts"></span></footer></section>
<aside class="inspector"><div class="panel-label">INSPECT & EDIT</div><div id="inspector"></div><div class="validation"><div class="validation-title"><h3>구조 점검</h3><span id="warningCount"></span></div><div id="warnings"></div><p>연결 구조 점검이며 ERC / 시뮬레이션 검증은 아닙니다.</p></div><button id="reviewBtn" class="review-button">✓ 현재 구조 검토 완료</button></aside>
</main>
<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="닫기">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="./app.js"></script>
</body></html>
